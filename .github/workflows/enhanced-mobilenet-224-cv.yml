name: Actual MobileNetV3 224px 12epoch grouped-CV improved recipe
on:
  push:
    paths:
      - '.github/workflows/enhanced-mobilenet-224-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: enhanced-mobilenet224-e12-v1
  cancel-in-progress: false
jobs:
  folds:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        fold: ['0','1','2','3','4','refit']
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TORCH_HOME: /tmp/torch-pretrained
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stop if exact result already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="enhanced-mobilenet-224e12-v1-${{ matrix.fold }}"
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo 'STOP: immutable enhanced result already exists' >&2
            exit 1
          fi
      - name: Install pytorch and metrics dependencies
        run: |
          python -m pip install torch torchvision numpy scikit-learn Pillow
          python -m pip install -e code --no-deps
      - name: Download only locked, cleaned source-grouped development archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bs-224/dev /tmp/bs-224/results
          gh release download leakage-controlled-dataset-v2-inferred-31-parents \
            --repo '${{ github.repository }}' \
            --pattern train.zip --pattern val.zip --pattern clean_manifest.csv \
            --dir /tmp/bs-224/dev
          printf '%s\n' \
            '9ffecc2e2c25cdf948e4b6483f8d6cc3109a045bdc18b653005557d07b23bb69  /tmp/bs-224/dev/train.zip' \
            '9f7df5beffc92d7247cc8b96999233ca1337f3e4e6fe2042d57d08de89c4aae6  /tmp/bs-224/dev/val.zip' \
            'a873092d19c7b47987c7311a561d35cac3ef254d5aa0110e9a62fd1434a0e2c5  /tmp/bs-224/dev/clean_manifest.csv' | sha256sum --check
          test ! -f /tmp/bs-224/dev/test.zip
      - name: Train 224px model and score only prespecified epochs 2 and 12
        run: |
          python code/scripts/enhanced_mobilenet_224_cv.py \
            --fold '${{ matrix.fold }}' \
            --train-zip /tmp/bs-224/dev/train.zip \
            --val-zip /tmp/bs-224/dev/val.zip \
            --manifest /tmp/bs-224/dev/clean_manifest.csv \
            --out /tmp/bs-224/results
      - name: Publish authentic result and provenance without overwriting prior work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="enhanced-mobilenet-224e12-v1-${{ matrix.fold }}"
          test -s /tmp/bs-224/results/milestone_report.json
          gh release create "$TAG" --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --prerelease --latest=false \
            --title "MobileNetV3 224px epochs 2/12 grouped development ${{ matrix.fold }}" \
            --notes 'Frozen protocol, same global 800+800 class_only SHA samples per fold, 224px, epochs 2 and 12, 26 inferred photo roots, no untouched prior holdout or StitchingNet opened. Model-selected-after-previous-exploration; OOF remains exploratory.'
          ASSETS=(/tmp/bs-224/results/milestone_report.json)
          if [[ '${{ matrix.fold }}' == 'refit' ]]; then
            test -s /tmp/bs-224/results/mobilenet_v3_224px_12epoch_dev_refit.pt
            ASSETS+=(/tmp/bs-224/results/mobilenet_v3_224px_12epoch_dev_refit.pt)
          else
            test -s /tmp/bs-224/results/epoch_milestone_oof.csv
            ASSETS+=(/tmp/bs-224/results/epoch_milestone_oof.csv)
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo '${{ github.repository }}'