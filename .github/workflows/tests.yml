name: Code unit tests (no private dataset)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          pip install -e code/
      - name: Run unit tests (synthetic examples only)
        run: |
          cd code
          python -m pytest -q