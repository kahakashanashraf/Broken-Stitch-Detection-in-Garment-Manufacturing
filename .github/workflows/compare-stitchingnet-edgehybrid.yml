name: Compare hybrid edge fusion against frozen synthetic MobileNet baseline
on:
  workflow_run:
    workflows:
      - 'Hybrid MobileNetV3 Sobel edge-fusion unseen-fabric experiment'
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paired_metrics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Do not overwrite immutable final comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view stitch-edgehybrid-paired-v1 --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "STOP: paired comparison exists" >&2
            exit 1
          fi
      - name: Install comparison libraries
        run: |
          python -m pip install numpy scikit-learn
      - name: Fetch prior baseline AND all new hybrid heldout-fabric fold predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for fold in 0 1 2 3 4; do
            BASE="/tmp/hybridpaired/baseline/$fold"
            NEW="/tmp/hybridpaired/hybrid/$fold"
            mkdir -p "$BASE" "$NEW"
            gh release download "stitchingnet-fabric-heldout-synthetic-f$fold-v1" \
              --repo '${{ github.repository }}' \
              --pattern fabric_heldout_oof_predictions.csv --dir "$BASE"
            gh release download "stitchingnet-edgehybrid-synthetic-f$fold-v1" \
              --repo '${{ github.repository }}' \
              --pattern fabric_edge_oof_predictions.csv \
              --pattern fabric_edge_report.json --dir "$NEW"
            test -s "$BASE/fabric_heldout_oof_predictions.csv"
            test -s "$NEW/fabric_edge_oof_predictions.csv"
            test -s "$NEW/fabric_edge_report.json"
          done
      - name: Exact sample-by-sample matched comparison and clustered uncertainty
        run: |
          python code/scripts/compare_fabric_edge_hybrid.py \
            --root /tmp/hybridpaired \
            --out /tmp/hybridpaired/results
      - name: Publish read-only paired comparison with no SOTA claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s /tmp/hybridpaired/results/edge_hybrid_paired_comparison.json
          gh release create stitch-edgehybrid-paired-v1 \
            --repo '${{ github.repository }}' --target '${{ github.sha }}' \
            --prerelease --latest=false \
            --title 'Edge hybrid vs unchanged MobileNetV3 six-epoch supervised fabric-heldout CV' \
            --notes 'The five hybrid folds are paired against the original synthetic-initialized supervised MobileNetV3 on identical held-out fabric identities. Binary normal/broken fixed 0.5 threshold. Retrospective previously inspected StitchingNet; NOT a new independent benchmark nor proof of defect localization.' \
            /tmp/hybridpaired/results/edge_hybrid_paired_comparison.json \
            /tmp/hybridpaired/results/EDGE_HYBRID_PAIRED_COMPARISON.md
