name: Build IEEE evidence-audit manuscript v3
on:
  push:
    paths:
      - 'paper/evidence_audit_v3.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and PDF audit utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Compile with original historical sample figures
        shell: bash
        run: |
          set -euo pipefail
          cd paper
          test -f figures/page33_image1.jpeg
          test -f figures/page33_image2.jpeg
          pdflatex -halt-on-error -interaction=nonstopmode evidence_audit_v3.tex >/tmp/bs_audit_latex1.log
          pdflatex -halt-on-error -interaction=nonstopmode evidence_audit_v3.tex >/tmp/bs_audit_latex2.log
          mv evidence_audit_v3.pdf ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf
          test "$(pdfinfo ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf | awk '/Pages:/ {print $2}')" -le 6
          test "$(stat -c%s ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf)" -lt 3000000
          pdfinfo ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf | grep 'Page size:.*A4'
          if pdffonts ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf | grep -q 'Type 3'; then echo 'STOP: Type3 fonts' >&2; exit 1; fi
          if pdftotext ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf - | grep -Eqi 'Johora Bibi Juhi|Kahakashan Ashraf|Dipra Das'; then echo 'STOP: author identity in PDF text' >&2; exit 1; fi
          sha256sum ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf > EVIDENCE_V3_PDF_SHA256.txt
          pdfinfo ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf | grep -E 'Pages:|Page size:|File size:'
      - name: Commit verified PDF without modifying older manuscript versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/ICEEICT2027_BrokenStitch_Evidence_Audit_v3_Anonymous.pdf paper/EVIDENCE_V3_PDF_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled 4-page evidence-audit paper with verified anonymous PDF'
            git push
          fi
