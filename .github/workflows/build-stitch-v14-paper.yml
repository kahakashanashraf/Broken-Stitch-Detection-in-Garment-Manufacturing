name: Build IEEE broken-stitch v14 publication terminology
on:
  push:
    paths:
      - 'paper/ICEEICT2027_BrokenStitch_v14_Model_Nomenclature.tex'
      - '.github/workflows/build-stitch-v14-paper.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-stitch-paper-v14
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install IEEE LaTeX and preflight software
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Compile and validate research paper
        run: |
          set -euo pipefail
          cd paper
          DOC=ICEEICT2027_BrokenStitch_v14_Model_Nomenclature
          test -s figures_v13/heldout_fabric_macro_f1.png
          test -s figures_v13/verified_cam_colorized_D_B.png
          pdflatex -halt-on-error -interaction=nonstopmode "$DOC.tex" >/tmp/stitch_v14_1.log
          pdflatex -halt-on-error -interaction=nonstopmode "$DOC.tex" >/tmp/stitch_v14_2.log
          test "$(pdfinfo "$DOC.pdf" | awk '/^Pages:/{print $2}')" -le 6
          test "$(stat -c%s "$DOC.pdf")" -lt 3000000
          pdfinfo "$DOC.pdf" | grep -q 'Page size:.*A4'
          test "$(grep -c '\\bibitem{' "$DOC.tex")" -eq 20
          if grep -E 'Citation .* undefined|Reference .* undefined|LaTeX Warning:.*undefined|Overfull \\hbox' /tmp/stitch_v14_2.log; then
            echo 'STOP: LaTeX warnings need editorial review' >&2; exit 1
          fi
          if pdffonts "$DOC.pdf" | grep -q 'Type 3'; then
            echo 'STOP: Type 3 font in paper' >&2; exit 1
          fi
          if pdftotext "$DOC.pdf" - | grep -Eqi 'Johora Bibi Juhi|Kahakashan Ashraf|Dipra Das'; then
            echo 'STOP: author identity found in anonymous PDF' >&2; exit 1
          fi
          sha256sum "$DOC.pdf" > V14_PDF_SHA256.txt
          pdfinfo "$DOC.pdf" | grep -E 'Pages:|Page size:|File size:'
      - name: Publish verified conference PDF
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/ICEEICT2027_BrokenStitch_v14_Model_Nomenclature.pdf paper/V14_PDF_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish v14 conference PDF with consistent model identifiers'
            git push
          fi
