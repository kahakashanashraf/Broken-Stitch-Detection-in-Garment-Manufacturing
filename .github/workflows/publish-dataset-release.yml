name: Publish original 2GB thesis dataset as GitHub Release asset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check 'gdown>=6.4'
      - name: Fetch original dataset from research Drive
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gdown 'https://drive.google.com/uc?id=1vE9D1jv_fmj1kNPejgTHgGCAfA_6EjPO' -O /tmp/dataset.zip; then
              break
            fi
            echo "Drive download attempt $attempt failed; retrying"
            rm -f /tmp/dataset.zip
            sleep 25
          done
          test -f /tmp/dataset.zip
          test "$(stat -c%s /tmp/dataset.zip)" -eq 2146784353
      - name: Validate ZIP directory and record hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          p=Path('/tmp/dataset.zip')
          with zipfile.ZipFile(p) as z:
              problems=z.testzip()
              if problems is not None: raise SystemExit('ZIP CRC mismatch: '+problems)
              members=z.infolist()
              if not members: raise SystemExit('Dataset archive is empty')
              sample=[z.filename for z in members[:30]]
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          report={'filename':'dataset.zip','size_bytes':p.stat().st_size,'sha256':digest,'zip_members':len(members),'archive_test':'all_members_crc_pass','validation':'file integrity only; labels and experiment provenance not audited','example_paths':sample}
          Path('/tmp/dataset_release_metadata.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='example_paths'},indent=2))
          PY
      - name: Publish original archive in a clearly labelled GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='original-thesis-dataset-v1'
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title 'Original thesis image archive (UNVERIFIED)' --notes 'Archive from project Google Drive. Original/augmented-image parentage, licensing, labels and evaluation splits have NOT been audited. Not an official performance benchmark. Use responsibly.' --prerelease --latest=false
          fi
          gh release upload "$TAG" /tmp/dataset.zip /tmp/dataset_release_metadata.json --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets,url -q '{url:.url,assets:[.assets[]|{name:.name,size:.size}]}'
