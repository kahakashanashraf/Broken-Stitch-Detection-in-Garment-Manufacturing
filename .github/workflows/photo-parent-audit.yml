name: Reconstruct Photoshop photo-parent filename graph (inference only)
on:
  push:
    paths:
      - .github/workflows/photo-parent-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  parent-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download verified original ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/parent
          gh release download original-thesis-dataset-v1 --repo '${{ github.repository }}' --pattern dataset.zip --dir /tmp/parent
          test "$(stat -c%s /tmp/parent/dataset.zip)" -eq 2146784353
      - name: Build inferred source-photo graph and photo-parent-disjoint SPLIT (not training)
        run: |
          python code/scripts/photo_parent_filename_map.py --zip /tmp/parent/dataset.zip --out /tmp/parent/results
      - name: Commit REVIEWABLE inferred mapping, never call it photo-source-verified
        run: |
          mkdir -p audits/photographed_source_inference
          cp /tmp/parent/results/* audits/photographed_source_inference/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/photographed_source_inference/photo_parent_filename_mapping_summary.json
          git add -f audits/photographed_source_inference/*.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish candidate Photoshop-parent mapping with inference-only caveat'
            git pull --rebase origin main
            git push
          fi