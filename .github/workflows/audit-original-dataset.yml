name: Audit original broken-stitch data archive
on:
  push:
    paths:
      - .github/workflows/audit-original-dataset.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download already-published original data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bs_data
          gh release download original-thesis-dataset-v1 --repo '${{ github.repository }}' --pattern dataset.zip --dir /tmp/bs_data
          test "$(stat -c%s /tmp/bs_data/dataset.zip)" -eq 2146784353
      - name: Audit source archive and save report
        run: |
          python code/scripts/audit_original_archive.py --zip /tmp/bs_data/dataset.zip --out audits/original_dataset_inventory_2026_10_18.json
      - name: Commit audit report without raw images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/original_dataset_inventory_2026_10_18.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add original dataset ZIP integrity, label and duplicate audit'
            git push
          fi