name: Frozen 224px 12epoch enhanced model descriptive StitchingNet external transfer
on:
  push:
    paths:
      - '.github/workflows/enhanced-224-stitchingnet-external.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stop if exact descriptive result already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view enhanced-224e12-stitchingnet-descriptive-v1 --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo 'STOP: archive immutable; do not retrain/tune or overwrite' >&2;exit 1
          fi
      - name: Install only read-only inference dependencies
        run: |
          python -m pip install torch torchvision numpy Pillow scikit-learn
          python -m pip install -e code --no-deps
      - name: Download frozen refit and official external archive, verify cryptographic hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bs-224-external/data /tmp/bs-224-external/results
          gh release download enhanced-mobilenet-224e12-v1-refit \
            --repo '${{ github.repository }}' \
            --pattern mobilenet_v3_224px_12epoch_dev_refit.pt \
            --dir /tmp/bs-224-external/data
          echo '0c1eaf25ad7daea5370fd16492b811c0b90408adb3a561f47d3a5c5c48a83a81  /tmp/bs-224-external/data/mobilenet_v3_224px_12epoch_dev_refit.pt' | sha256sum --check
          curl -L --retry 3 --retry-delay 5 --fail \
            'https://zenodo.org/records/20352813/files/StitchingNet.zip?download=1' \
            -o /tmp/bs-224-external/data/StitchingNet.zip
          echo '51b228d9572b925035e9e9af01c96569  /tmp/bs-224-external/data/StitchingNet.zip' | md5sum --check
          test ! -f /tmp/bs-224-external/data/test.zip
      - name: Predict ONLY at frozen threshold 0.5; no external calibration or fitting
        run: |
          python code/scripts/evaluate_enhanced_stitchingnet.py \
            --external-zip /tmp/bs-224-external/data/StitchingNet.zip \
            --weights /tmp/bs-224-external/data/mobilenet_v3_224px_12epoch_dev_refit.pt \
            --out /tmp/bs-224-external/results
      - name: Publish descriptive external score and image-level predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create enhanced-224e12-stitchingnet-descriptive-v1 \
            --repo '${{ github.repository }}' --target '${{ github.sha }}' \
            --prerelease --latest=false \
            --title 'Frozen enhanced 224px 12ep MobileNetV3 on previously inspected StitchingNet external subset' \
            --notes 'Only read-only transfer on previously inspected StitchingNet; no training, calibration, architecture selection or threshold sweep. 2436 normal and 1201 broken images, 0.5 threshold. Not a new blind external validation, not real-world deployment accuracy.' \
            /tmp/bs-224-external/results/external_enhanced_metrics.json \
            /tmp/bs-224-external/results/external_enhanced_predictions.csv