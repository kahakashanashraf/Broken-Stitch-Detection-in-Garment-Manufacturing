name: Hybrid MobileNetV3 Sobel edge-fusion unseen-fabric experiment
on:
  push:
    paths:
      - '.github/workflows/stitchingnet-edgehybrid.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stitch-edgehybrid-fabric-v1
  cancel-in-progress: false
jobs:
  fabric_hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fold: ['0', '1', '2', '3', '4']
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TORCH_HOME: /tmp/torch-pretrained
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable release is not overwritten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stitchingnet-edgehybrid-synthetic-f${{ matrix.fold }}-v1"
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "STOP: immutable hybrid fold release exists" >&2
            exit 1
          fi
      - name: Install PyTorch and test dependencies
        run: |
          python -m pip install torch torchvision scikit-learn numpy Pillow pytest
          python -m pip install -e code --no-deps
      - name: Verify gate equivalence, gradients, fold aggregation and failure guards
        run: |
          python -m pytest -q code/tests/test_fabric_edge_hybrid.py
      - name: Fetch real dataset and original six-epoch synthetic initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edgehybrid/input /tmp/edgehybrid/output
          gh release download enhanced-mobilenet-224e12-v1-refit \
            --repo '${{ github.repository }}' \
            --pattern mobilenet_v3_224px_12epoch_dev_refit.pt \
            --dir /tmp/edgehybrid/input
          echo '0c1eaf25ad7daea5370fd16492b811c0b90408adb3a561f47d3a5c5c48a83a81  /tmp/edgehybrid/input/mobilenet_v3_224px_12epoch_dev_refit.pt' | sha256sum -c -
          curl --fail -L --retry 5 --retry-all-errors --retry-delay 5 \
            'https://zenodo.org/records/20352813/files/StitchingNet.zip?download=1' \
            -o /tmp/edgehybrid/input/StitchingNet.zip
          echo '51b228d9572b925035e9e9af01c96569  /tmp/edgehybrid/input/StitchingNet.zip' | md5sum -c -
      - name: Train edge fusion on four-fabric training folds and predict unseen fabrics
        run: |
          python code/scripts/fabric_edge_hybrid_cv.py \
            --stitchingnet-zip /tmp/edgehybrid/input/StitchingNet.zip \
            --synthetic-weights /tmp/edgehybrid/input/mobilenet_v3_224px_12epoch_dev_refit.pt \
            --fold '${{ matrix.fold }}' \
            --epochs 6 --batch-size 16 \
            --out /tmp/edgehybrid/output
      - name: Publish only case-level probability evidence and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stitchingnet-edgehybrid-synthetic-f${{ matrix.fold }}-v1"
          test -s /tmp/edgehybrid/output/fabric_edge_oof_predictions.csv
          test -s /tmp/edgehybrid/output/fabric_edge_report.json
          gh release create "$TAG" --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' --prerelease --latest=false \
            --title "Exploratory MobileNetV3 and Sobel edge hybrid on unseen fabric fold ${{ matrix.fold }}" \
            --notes 'Original synthetic-init MobileNetV3 plus learned Sobel edge branch with zero-initialized residual logit gate. Fixed six epochs and same seed/folds as original supervised fabric CV. Prior inspection of StitchingNet means this is retrospective descriptive CV, not a fresh independent test. No third-party images republished; source dataset CC BY-NC 4.0.' \
            /tmp/edgehybrid/output/fabric_edge_oof_predictions.csv \
            /tmp/edgehybrid/output/fabric_edge_report.json
