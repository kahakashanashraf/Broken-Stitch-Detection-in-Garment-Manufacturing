[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broken-stitch-reconstruction"
version = "0.2.0"
description = "Auditable reconstruction of thesis broken-stitch classification experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["broken_stitch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]